kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-labs
networking:
  disableDefaultCNI: true        # Calico is installed by cluster/up.sh so NetworkPolicy is enforced
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080      # Gitea NodePort
        hostPort: 30080
        protocol: TCP
      - containerPort: 80         # ingress-nginx (hostPort on control-plane)
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
