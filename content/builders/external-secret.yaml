id: external-secret
title: "ExternalSecret: sync a Secret from an external store"
kind: ExternalSecret
apiVersion: external-secrets.io/v1
realm: manifests
track: security
difficulty: intermediate
estimated_minutes: 18
summary: >
  Build an ExternalSecret that pulls podinfo's database credentials from
  a ClusterSecretStore into a Kubernetes Secret, with an owned target, a
  templated connection string and explicit key mapping, and learn how the
  controller syncs and what happens when the store is unreachable.
intro: |
  External Secrets Operator (ESO) copies secrets *into* Kubernetes rather
  than making Pods talk to a vault. An `ExternalSecret` says: using store
  X, fetch these remote keys, and write them into Secret Y every
  `refreshInterval`. The controller resolves the store (a namespaced
  `SecretStore` or a cluster-wide `ClusterSecretStore` holding provider
  config and auth), fetches the values, renders the optional template,
  and creates or updates the target Secret, recording the result in
  `status.conditions` (`Ready`, reason `SecretSynced` or
  `SecretSyncedError`) and `status.refreshTime`.

  The Secret is a **copy**. Pods see updates only the way they see any
  Secret change: volume mounts refresh within the kubelet sync period
  (never through `subPath`), environment variables never until a restart.
  When the provider is unreachable, ESO marks the ExternalSecret not
  Ready, emits an event with the provider error, retries with backoff and
  leaves the **existing** Secret untouched, so running workloads keep
  the last good value and only new Pods or rotated credentials are
  affected. A target Secret that never synced simply does not exist, and
  Pods referencing it hang in `CreateContainerConfigError`.

  The lab cluster does not ship an ESO provider, so this is a
  manifest-only activity; the store named here is illustrative.
prerequisites: [configmap-basics]
crd: true
docs_url: https://external-secrets.io/latest/api/externalsecret/
steps:
  - path: apiVersion
    title: "API group and version"
    prompt: "Declare the External Secrets API."
    why: |
      ESO promoted its core kinds (ExternalSecret, SecretStore,
      ClusterSecretStore, ClusterExternalSecret) to `external-secrets.io/v1`
      in 2025. `v1beta1` remains in the CRD only as an unserved, deprecated
      version marker (`served: false`), so manifests must say
      `external-secrets.io/v1`; `v1alpha1` is gone. Generators (`Password`,
      `ECRAuthorizationToken`...) remain under `generators.external-secrets.io`.
    hint: "The project domain as the group; stable version v1."
    expect: { type: equals, value: external-secrets.io/v1 }
    reveal: "apiVersion: external-secrets.io/v1"
  - path: kind
    title: "Kind"
    prompt: "Name the resource type."
    why: |
      `ExternalSecret` is namespaced and produces one Secret.
      `ClusterExternalSecret` stamps the same ExternalSecret into many
      namespaces by selector, which is how a platform team distributes a
      registry pull secret. `PushSecret` goes the other way, from the
      cluster to the provider.
    hint: "CamelCase, singular; the namespaced one."
    expect: { type: equals, value: ExternalSecret }
    reveal: "kind: ExternalSecret"
  - path: metadata.name
    title: "Name"
    prompt: "Name the ExternalSecret."
    why: |
      Defaults the target Secret name when `target.name` is omitted and
      labels the `externalsecret_status_condition` metric and events, so
      name it after what it produces. One ExternalSecret per consumer
      Secret keeps failures isolated: a missing remote key fails only that
      object.
    hint: "Lowercase DNS label; typically the Secret you want."
    expect: { type: regex, value: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
    reveal: |
      metadata:
        name: podinfo-db
  - path: metadata.namespace
    title: "Namespace"
    prompt: "Place it where the Secret must land."
    why: |
      The target Secret is always created in the ExternalSecret's
      namespace. A `ClusterSecretStore` can restrict which namespaces may
      use it (`spec.conditions` with namespace names or selectors), so a
      perfectly valid ExternalSecret in a namespace the store does not
      allow fails with `namespace not allowed`. Namespaced `SecretStore`
      objects avoid that by living with the consumer.
    hint: "The lab-* namespace of the workload that reads the Secret."
    expect: { type: regex, value: "^lab-[a-z0-9-]+$" }
    reveal: "  namespace: lab-podinfo"
  - path: spec.refreshInterval
    title: "Refresh interval"
    prompt: "Re-fetch the remote values every hour."
    why: |
      How often the controller calls the provider for this object; the
      default is `1h`. Every ExternalSecret is a separate API call per
      interval, and cloud secret managers bill per call, so `10s` across
      500 objects is a real invoice. `0` disables refresh after the first
      sync (fetch-once). Rotation in the provider shows up in the Secret
      at most one interval later; to react faster, trigger a sync by
      annotating the object with `force-sync: <timestamp>`.
    hint: "A duration; think about provider API cost times the number of objects."
    expect: { type: regex, value: "^([0-9]+(h|m|s))+$|^0$" }
    reveal: |
      spec:
        refreshInterval: 1h
    gotchas:
      - "A changed ExternalSecret spec is reconciled immediately; the interval only governs re-fetching unchanged specs."
  - path: spec.secretStoreRef.name
    title: "Store name"
    prompt: "Reference the store that knows how to reach the provider."
    why: |
      The store holds everything provider-specific: endpoint, path or
      region, and authentication (a Kubernetes ServiceAccount for workload
      identity, or a Secret with static credentials). The ExternalSecret
      itself carries no credentials, which is the point: application
      teams write ExternalSecrets, the platform team writes stores. A
      store that is not Ready makes every dependent ExternalSecret fail
      with `SecretStore not ready`.
    hint: "metadata.name of the store object."
    expect: { type: regex, value: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
    reveal: |
      secretStoreRef:
        name: lab-vault
  - path: spec.secretStoreRef.kind
    title: "Store kind"
    prompt: "State that the store is cluster-scoped."
    why: |
      `kind` defaults to `SecretStore` (namespaced). Referencing a
      `ClusterSecretStore` without `kind` makes the controller look for a
      SecretStore of that name in this namespace and report
      `SecretStore "lab-vault" not found` while the ClusterSecretStore
      sits right there. Same trap as cert-manager's `issuerRef.kind`.
    hint: "Two kinds exist; the shared one is not namespaced."
    expect: { type: oneOf, value: [SecretStore, ClusterSecretStore] }
    reveal: "kind: ClusterSecretStore"
    gotchas:
      - "kubectl get clustersecretstore,secretstore -A tells you which one exists and whether it is Ready."
  - path: spec.target.name
    title: "Target Secret name"
    prompt: "Name the Secret that will be created."
    why: |
      Defaults to the ExternalSecret name. Writing it explicitly decouples
      the two: the Secret name is an interface consumed by Deployments and
      Helm values and should be stable, while the ExternalSecret can be
      renamed or split. Two ExternalSecrets writing the same target with
      `creationPolicy: Owner` fight over ownership; use `Merge` for that.
    hint: "A Secret name in this namespace."
    expect: { type: regex, value: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" }
    reveal: |
      target:
        name: podinfo-db
  - path: spec.target.creationPolicy
    title: "Creation policy"
    prompt: "Let the ExternalSecret own the Secret."
    why: |
      `Owner` (default) creates the Secret with an ownerReference, so
      deleting the ExternalSecret garbage-collects the Secret. `Orphan`
      creates it without the reference and leaves it behind. `Merge`
      only updates keys in a Secret that already exists (a Helm-created
      one, for instance) and fails if it does not. `None` never writes;
      the object only validates the store. Pick `Owner` unless something
      else creates the Secret first.
    hint: "Four values; the default is the one with garbage collection."
    expect: { type: oneOf, value: [Owner, Orphan, Merge, None] }
    reveal: "creationPolicy: Owner"
    gotchas:
      - "Owner plus a pre-existing Secret created by hand: ESO adopts and overwrites it, including keys you added manually."
  - path: spec.target.deletionPolicy
    title: "Deletion policy"
    prompt: "Keep the Secret if the remote keys disappear."
    why: |
      Governs the Secret when the **remote** data is gone, not when the
      ExternalSecret is deleted. `Retain` (default) keeps the last synced
      Secret and reports an error; `Delete` removes the Secret, which
      turns a provider-side mistake into a production outage on the next
      Pod restart; `Merge` removes only the keys this object managed.
      Retain is the safe choice for credentials.
    hint: "Three values; think about what a deleted key in the vault should do to running Pods."
    expect: { type: oneOf, value: [Retain, Delete, Merge] }
    reveal: "deletionPolicy: Retain"
  - path: spec.target.template.type
    title: "Secret type via template"
    prompt: "Declare the Secret type in the template block."
    why: |
      Without a template ESO writes an `Opaque` Secret whose keys are the
      `secretKey` names. `target.template` controls the Secret's `type`
      (`kubernetes.io/tls`, `kubernetes.io/dockerconfigjson`,
      `kubernetes.io/basic-auth`), its metadata labels and annotations,
      and lets you render `data` with Go templates. The type must match
      the key layout the consumer expects: a dockerconfigjson Secret needs
      exactly the `.dockerconfigjson` key.
    hint: "Under target.template; the plain default type works here."
    expect: { type: regex, value: "^(Opaque|kubernetes\\.io/[a-z-]+)$" }
    reveal: |
      template:
        type: Opaque
        engineVersion: v2
  - path: spec.target.template.data
    title: "Templated keys"
    prompt: "Render a DATABASE_URL from the fetched username and password."
    why: |
      `template.data` values are Go templates (engine `v2`) evaluated
      with every fetched key as a variable: `{{ .DB_PASSWORD }}` refers to
      the `secretKey` names below. This is how you assemble a connection
      string or a config file from several remote properties without
      the application knowing about the vault. By default a template
      **replaces** the Secret contents (`mergePolicy: Replace`): the plain
      `data` keys vanish unless you set `mergePolicy: Merge`.
    hint: "A map of key to template string; reference secretKey names with {{ .NAME }}."
    expect: { type: exists }
    reveal: |
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgres://{{ .DB_USERNAME }}:{{ .DB_PASSWORD }}@postgres.lab-podinfo.svc:5432/podinfo?sslmode=require"
    gotchas:
      - "A Flux Kustomization with postBuild substitution does not touch {{ }}, but it does rewrite ${VAR} inside templates."
  - path: spec.data
    title: "Explicit key mapping"
    prompt: "Map the remote password and username into named Secret keys."
    why: |
      Each `data` entry maps one `remoteRef` to one `secretKey` in the
      target. Explicit mapping documents which remote properties the app
      depends on and lets you rename them (`password` → `DB_PASSWORD`).
      `dataFrom` is the bulk alternative: `extract` copies every property
      of a remote key as-is, `find` pulls every key matching a regexp.
      Mixing is allowed; `data` entries override `dataFrom` keys of the
      same name.
    hint: "A list of maps with secretKey and remoteRef."
    expect: { type: list, value: { min_items: 1, item_keys: [secretKey, remoteRef] } }
    reveal: |
      data:
        - secretKey: DB_PASSWORD
          remoteRef:
            key: lab/podinfo/db
            property: password
        - secretKey: DB_USERNAME
          remoteRef:
            key: lab/podinfo/db
            property: username
    gotchas:
      - "dataFrom with extract copies property names verbatim; a vault key containing '/' or '.' in a property name produces an invalid Secret key."
  - path: spec.data[0].remoteRef.key
    title: "Remote key"
    prompt: "Point at the provider's secret path."
    why: |
      The provider-specific identifier: a Vault KV path, an AWS Secrets
      Manager name or ARN, a GCP secret id. ESO applies the store's
      `path` prefix (for Vault) on top of it, so the value here is
      relative to what the store exposes. A wrong key is the most
      frequent `SecretSyncedError`; the event text contains the provider's
      own 404.
    hint: "A path-like string as the provider names it."
    expect: { type: regex, value: "^[A-Za-z0-9/_.:-]+$" }
    reveal: "key: lab/podinfo/db"
  - path: spec.data[0].remoteRef.property
    title: "Remote property"
    prompt: "Select one field of the remote secret."
    why: |
      Many providers store a JSON object under one key. `property`
      selects a field (gjson syntax, so `db.password` and `users.0.name`
      work); omitting it stores the whole JSON blob as the Secret value,
      which is what `dataFrom.extract` unpacks into individual keys. For
      providers with flat values (one string per key) leave it out.
    hint: "The field name inside the remote JSON object."
    expect: { type: regex, value: "^[A-Za-z0-9_.-]+$" }
    reveal: "property: password"
final_manifest: |
  apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
    name: podinfo-db
    namespace: lab-podinfo
  spec:
    refreshInterval: 1h
    secretStoreRef:
      name: lab-vault
      kind: ClusterSecretStore
    target:
      name: podinfo-db
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
        engineVersion: v2
        mergePolicy: Merge
        data:
          DATABASE_URL: "postgres://{{ .DB_USERNAME }}:{{ .DB_PASSWORD }}@postgres.lab-podinfo.svc:5432/podinfo?sslmode=require"
    data:
      - secretKey: DB_PASSWORD
        remoteRef:
          key: lab/podinfo/db
          property: password
      - secretKey: DB_USERNAME
        remoteRef:
          key: lab/podinfo/db
          property: username
quiz:
  - q: "The vault is down for two hours. What happens to a Secret that synced successfully yesterday?"
    options:
      - "It is deleted after the first failed refresh"
      - "It keeps its last synced values; the ExternalSecret reports SecretSyncedError"
      - "Its keys are emptied"
      - "Pods using it are restarted"
    answer: 1
    explain: "Fetch failures never modify the existing Secret; only the status and events change."
  - q: "You reference a ClusterSecretStore but omit secretStoreRef.kind. What does ESO report?"
    options:
      - "It works; the name is unique"
      - "SecretStore not found, because kind defaults to SecretStore"
      - "A validation error at admission"
      - "ClusterSecretStore not allowed"
    answer: 1
    explain: "The default kind is the namespaced SecretStore, so the lookup misses."
  - q: "You add target.template.data with one key and leave the default mergePolicy. What is in the Secret?"
    options:
      - "The templated key plus every data/dataFrom key"
      - "Only the templated key"
      - "Only the data keys; templates need Merge to apply"
      - "Nothing; it is a conflict"
    answer: 1
    explain: "The default mergePolicy is Replace: the template output becomes the whole Secret; set Merge to keep the plain keys."
