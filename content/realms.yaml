categories:                   # scenario categories
  - id: config
    title: "Config issues"
    description: "ConfigMaps, Secrets, env, probes, images, resources."
  - id: network
    title: "Network issues"
    description: "Services, endpoints, DNS, NetworkPolicy, Ingress."
  - id: node
    title: "Node issues"
    description: "Cordons, taints, kubelet, capacity, affinity."
  - id: cluster
    title: "Cluster issues"
    description: "Control plane static pods, etcd, scheduler, controller-manager."
  - id: workload
    title: "Workload issues"
    description: "Deployments, rollouts, StatefulSets, Jobs."
  - id: storage
    title: "Storage issues"
    description: "PVC binding, StorageClass, mounts."
  - id: rbac
    title: "RBAC & security"
    description: "ServiceAccounts, roles, bindings, admission."
  - id: gitops
    title: "GitOps (Flux)"
