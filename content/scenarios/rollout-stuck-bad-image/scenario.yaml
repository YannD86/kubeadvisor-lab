id: rollout-stuck-bad-image
title: "Rollout stuck, pipeline failing on rollout status"
realm: scenarios
category: workload
type: troubleshoot
difficulty: intermediate
estimated_minutes: 15
tags: [deployment, rollout, revision, undo, ImagePullBackOff]
requires_addons: []
summary: "A hotfix deploy of web in lab-rollout has been stuck for 20 minutes and the pipeline's kubectl rollout status fails with 'exceeded its progress deadline'. Users are fine for now. Get the Deployment back to a healthy, complete rollout."
brief: |
  **Ticket #5218 — P2 — web hotfix rollout never completes**

  The frontend team shipped a hotfix (revision 2) of the `web` Deployment in
  namespace `lab-rollout` 20 minutes ago. Their pipeline runs `kubectl rollout
  status deploy/web`; it waited two minutes, then failed with `error:
  deployment "web" exceeded its progress deadline`, and the pipeline has been
  red since. `kubectl get deploy` shows `3/3 READY` but `UP-TO-DATE 1`, and
  there are four Pods instead of three, one of them not Ready.

  Users have not noticed anything (the old Pods are still serving), but the
  team cannot ship anything else until this rollout is resolved, and the
  on-call wants it done before the evening peak.

  ## Your task
  - `kubectl rollout status deploy/web -n lab-rollout` completes successfully: 3 replicas desired, 3 up-to-date, 3 ready.
  - Every `web` Pod runs an image with a real, pullable nginx tag; no Pod left in ImagePullBackOff.
  - `http://web` keeps answering HTTP 200 from inside the cluster.
namespace: lab-rollout
hints:
  - "kubectl rollout status deploy/web -n lab-rollout --timeout=10s and kubectl get rs -n lab-rollout: which ReplicaSet is the new one, and how many of its Pods are Ready?"
  - "kubectl describe pod on the not-Ready Pod: the Events show why the new revision cannot start. Then kubectl rollout history deploy/web -n lab-rollout --revision=2 shows what changed."
  - "A stuck rollout with a bad new revision is what kubectl rollout undo is for: it re-creates the previous template as a new revision (3), and the broken ReplicaSet is scaled to 0."
  - "If you prefer to roll forward: kubectl set image deploy/web web=nginx:1.27-alpine -n lab-rollout. Either way, finish with kubectl rollout status until it returns."
checks:
  - name: "Rollout is complete"
    cmd: kubectl rollout status -n lab-rollout deploy/web --timeout=15s >/dev/null
  - name: "3 desired, 3 up-to-date, 3 ready"
    cmd: test "$(kubectl get deploy -n lab-rollout web -o jsonpath='{.spec.replicas}/{.status.updatedReplicas}/{.status.readyReplicas}')" = "3/3/3"
  - name: "Deployment image is a real pinned nginx tag"
    cmd: img=$(kubectl get deploy -n lab-rollout web -o jsonpath='{.spec.template.spec.containers[0].image}'); echo "$img" | grep -Eq '^(docker\.io/)?(library/)?nginx:[0-9]' && test "$(echo "$img" | grep -Ec 'broken|latest')" = "0"
  - name: "No Pod remains in ImagePullBackOff / ErrImagePull"
    cmd: for i in 1 2 3 4 5; do test "$(kubectl get pods -n lab-rollout -l app=web -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' | grep -Ec 'ImagePullBackOff|ErrImagePull')" = "0" && exit 0; sleep 2; done; exit 1
  - name: "HTTP 200 from a Pod inside the cluster"
    cmd: kubectl run -n lab-rollout probe-$RANDOM --rm -i --restart=Never --image=curlimages/curl:8.10.1 --quiet -- -s -o /dev/null -w '%{http_code}' --max-time 5 http://web | grep -q 200
concepts:
  - "A rolling update creates a new ReplicaSet and moves replicas over within maxSurge/maxUnavailable. With maxUnavailable: 0 a broken new revision cannot hurt users, but the rollout stays stuck until someone acts; after progressDeadlineSeconds the Deployment reports Progressing=False (ProgressDeadlineExceeded)."
  - "`kubectl rollout history` / `--revision=N` shows the template of each revision; `kubectl rollout undo` re-applies the previous template as a *new* revision, so history keeps moving forward and the fix is auditable."
  - "`kubectl rollout status` blocks until the rollout completes or the deadline is exceeded: a hanging pipeline step is a stuck rollout, not a slow one."
related_lessons: [troubleshooting/workload-and-rollout-triage]
